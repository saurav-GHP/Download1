<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Server Node</title>

<style>

body{
margin:0;
background:black;
color:#00ff9c;
font-family:monospace;
text-align:center;
overflow:hidden;
}

/* INTRO SCREEN */

#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:5;
}

#enter{
padding:15px 40px;
font-size:18px;
background:#00ff9c;
border:none;
cursor:pointer;
box-shadow:0 0 20px #00ff9c;
margin-top:25px;
}

/* MATRIX */

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* TITLE */

h1{
margin-top:80px;
text-shadow:0 0 20px #00ff9c;
}

/* TERMINAL */

#terminal{
width:90%;
max-width:850px;
margin:40px auto;
background:black;
border:1px solid #00ff9c;
padding:20px;
text-align:left;
box-shadow:0 0 20px #00ff9c;
height:260px;
overflow-y:auto;
}

/* INPUT */

#cmd{
width:100%;
background:black;
border:none;
color:#00ff9c;
outline:none;
font-family:monospace;
font-size:16px;
}

/* PROGRESS */

#progress{
width:90%;
max-width:850px;
margin:auto;
border:1px solid #00ff9c;
background:#001a12;
display:none;
}

#bar{
height:20px;
width:0%;
background:#00ff9c;
}

/* LOGO */

.logo{
font-size:70px;
margin-bottom:10px;
}

</style>
</head>

<body>

<div id="intro">

<div class="logo">💀</div>

<div id="introText"></div>

<button id="enter" onclick="enterSite()">ENTER SERVER</button>

</div>

<canvas id="matrix"></canvas>

<h1>SECURE GAME SERVER</h1>

<div id="terminal">

<div>> type <b>help</b> for commands</div>

<input id="cmd" placeholder="enter command">

</div>

<div id="progress">
<div id="bar"></div>
</div>

<audio id="typeSound" src="https://assets.mixkit.co/sfx/preview/mixkit-typewriter-soft-click-1125.mp3"></audio>

<script>

/* INTRO TYPING */

const introLines=[
"CONNECTING TO DARK NODE...",
"BYPASSING FIREWALL...",
"SCANNING USER IP...",
"ACCESS GRANTED"
];

let i=0;
let j=0;

function typeIntro(){

if(i<introLines.length){

if(j<introLines[i].length){

document.getElementById("introText").innerHTML+=introLines[i].charAt(j);
j++;

setTimeout(typeIntro,40);

}else{

document.getElementById("introText").innerHTML+="<br>";
i++;
j=0;

setTimeout(typeIntro,400);

}

}

}

typeIntro();

function enterSite(){

document.getElementById("intro").style.display="none";

}

/* MATRIX BACKGROUND */

const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

canvas.height=window.innerHeight;
canvas.width=window.innerWidth;

let letters="01".split("");
let fontSize=14;
let columns=canvas.width/fontSize;

let drops=[];

for(let x=0;x<columns;x++)
drops[x]=1;

function draw(){

ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#0f0";
ctx.font=fontSize+"px monospace";

for(let i=0;i<drops.length;i++){

let text=letters[Math.floor(Math.random()*letters.length)];

ctx.fillText(text,i*fontSize,drops[i]*fontSize);

if(drops[i]*fontSize>canvas.height && Math.random()>0.975)
drops[i]=0;

drops[i]++;

}

}

setInterval(draw,33);

/* COMMAND TERMINAL */

const cmdInput=document.getElementById("cmd");
const terminal=document.getElementById("terminal");
const sound=document.getElementById("typeSound");

cmdInput.addEventListener("keydown",function(e){

sound.currentTime=0;
sound.play();

if(e.key==="Enter"){

let cmd=this.value.toLowerCase();

let line=document.createElement("div");
line.innerText="> "+cmd;
terminal.appendChild(line);

this.value="";

if(cmd==="help"){

addOutput("commands:");
addOutput("download  - get the game");
addOutput("scan      - scan server");
addOutput("clear     - clear terminal");

}

else if(cmd==="scan"){

fakeScan();

}

else if(cmd==="download"){

startDownload();

}

else if(cmd==="clear"){

terminal.innerHTML="";

}

else{

addOutput("unknown command");

}

}

});

function addOutput(text){

let div=document.createElement("div");
div.innerText=text;
terminal.appendChild(div);

}

/* FAKE IP SCAN */

function fakeScan(){

addOutput("scanning network...");

setTimeout(()=>addOutput("ip found: 192.168.43.21"),800);
setTimeout(()=>addOutput("server located"),1500);
setTimeout(()=>addOutput("ready for download"),2000);

}

/* DOWNLOAD PROGRESS */

function startDownload(){

document.getElementById("progress").style.display="block";

let bar=document.getElementById("bar");

let width=0;

let interval=setInterval(function(){

if(width>=100){

clearInterval(interval);

window.location.href="https://mega.nz/file/0C9zDCBa#PGg9XSCcbUlr2XK99N7xPowE2HbhlB7QsW7abld8c4A";

}else{

width++;
bar.style.width=width+"%";

}

},40);

}

</script>

</body>
</html>
